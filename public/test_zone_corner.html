<!DOCTYPE html>
<html>
<head>
    <title>Packing Algorithm Test</title>
    <script>
        // Simplified packing test to verify zone corner alignment
        class SimpleBinPacker {
            constructor() {
                this.bins = [];
                this.gap = 0;
            }

            addBin(bin) {
                this.bins.push({
                    id: bin.id,
                    width: bin.width,
                    height: bin.height,
                    depth: bin.depth,
                    maxWeight: bin.maxWeight || Infinity,
                    items: [],
                    usedVolume: 0,
                    usedWeight: 0,
                    corners: [
                        { x: 0, y: 0, z: 0 },
                        { x: bin.width, y: 0, z: 0 },
                        { x: 0, y: 0, z: bin.depth },
                        { x: bin.width, y: 0, z: bin.depth }
                    ]
                });
            }

            findZoneCorner(zoneName, bin) {
                const zoneCornerInfo = {
                    frontLeft: { baseX: 0, baseZ: 0, alignRight: false, alignBack: false },
                    frontRight: { baseX: bin.width, baseZ: 0, alignRight: true, alignBack: false },
                    backLeft: { baseX: 0, baseZ: bin.depth, alignRight: false, alignBack: true },
                    backRight: { baseX: bin.width, baseZ: bin.depth, alignRight: true, alignBack: true }
                };
                return zoneCornerInfo[zoneName];
            }

            calculatePosition(item, zoneName, bin) {
                const zoneCorner = this.findZoneCorner(zoneName, bin);

                // Calculate position based on alignment
                let itemX = zoneCorner.alignRight ? Math.max(0, bin.width - item.width) : zoneCorner.baseX;
                let itemZ = zoneCorner.alignBack ? Math.max(0, bin.depth - item.depth) : zoneCorner.baseZ;

                return {
                    x: itemX,
                    y: 0,
                    z: itemZ,
                    endX: itemX + item.width,
                    endZ: itemZ + item.depth
                };
            }
        }

        // Test
        const packer = new SimpleBinPacker();
        packer.addBin({ id: 1, width: 8, height: 2.5, depth: 10, maxWeight: 600 });
        const bin = packer.bins[0];

        const items = [
            { name: 'Steel Coils', width: 1.2, height: 0.9, depth: 1.5 },
            { name: 'Wooden Pallets', width: 0.8, height: 1.0, depth: 1.2 },
            { name: 'Glass Bottles', width: 0.6, height: 1.0, depth: 0.8 },
        ];

        const zones = ['frontLeft', 'frontRight', 'backLeft', 'backRight'];

        let html = '<h1>Zone Corner Positioning Test</h1>';
        html += '<table border="1" cellpadding="10">';
        html += '<tr><th>Zone</th><th>Item</th><th>Width×Depth</th><th>Position</th><th>Ends at</th><th>Hugs Wall?</th></tr>';

        zones.forEach((zone, zoneIdx) => {
            const item = items[zoneIdx % items.length];
            const pos = packer.calculatePosition(item, zone, bin);

            let hugsWall = '✅';
            if (zone.includes('Right') && pos.endX !== bin.width) hugsWall = '❌ (x=' + pos.endX + ', not 8)';
            if (zone.includes('back') && pos.endZ !== bin.depth) hugsWall = '❌ (z=' + pos.endZ + ', not 10)';

            html += '<tr>';
            html += '<td>' + zone + '</td>';
            html += '<td>' + item.name + '</td>';
            html += '<td>' + item.width + '×' + item.depth + '</td>';
            html += '<td>(' + pos.x.toFixed(1) + ', ' + pos.y.toFixed(1) + ', ' + pos.z.toFixed(1) + ')</td>';
            html += '<td>(' + pos.endX.toFixed(1) + ', ?, ' + pos.endZ.toFixed(1) + ')</td>';
            html += '<td>' + hugsWall + '</td>';
            html += '</tr>';
        });

        html += '</table>';
        document.body.innerHTML = html;
    </script>
</head>
<body>
    <p>Loading test...</p>
</body>
</html>
