<!DOCTYPE html>
<html>
<head>
    <title>Item Rotation Test</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #f5f5f5; }
        .item { background: white; padding: 15px; margin: 10px 0; border-left: 4px solid #2196F3; }
        .rotated { border-left-color: #FF9800; }
        .breakable { border-left-color: #f44336; }
        table { border-collapse: collapse; }
        td { padding: 5px 10px; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Item Rotation Test</h1>
    <p>Tree-like items (aspect ratio > 1.3) that are NOT breakable should rotate to lay flat</p>

    <script>
        class TestPacker {
            autoRotateToFlatten(item) {
                if (item.is_breakable) {
                    return item;
                }

                const dims = [item.width, item.height, item.depth];
                const maxDim = Math.max(...dims);
                const minDim = Math.min(...dims);
                const aspectRatio = maxDim / minDim;

                if (aspectRatio > 1.3 && item.height === maxDim) {
                    const rotated = {
                        ...item,
                        width: item.width,
                        height: item.depth,
                        depth: item.height,
                        rotated: true,
                        originalDims: `${item.width}×${item.height}×${item.depth}`,
                        rotatedDims: `${item.width}×${item.depth}×${item.height}`
                    };
                    return rotated;
                }

                return item;
            }
        }

        const packer = new TestPacker();
        const items = [
            { description: 'Glass Bottles', width: 0.6, height: 1.0, depth: 0.8, weight: 60, is_breakable: true },
            { description: 'Electronics', width: 0.5, height: 0.8, depth: 0.7, weight: 45, is_breakable: true },
            { description: 'Steel Coils', width: 1.2, height: 0.9, depth: 1.5, weight: 150, is_breakable: false },
            { description: 'Cement Bags', width: 0.5, height: 1.5, depth: 0.4, weight: 50, is_breakable: false },
            { description: 'Plastic Drums', width: 0.9, height: 1.1, depth: 0.9, weight: 35, is_breakable: false },
            { description: 'Rice Sacks', width: 0.6, height: 1.2, depth: 0.8, weight: 50, is_breakable: false },
        ];

        let html = '';
        items.forEach(item => {
            const rotated = packer.autoRotateToFlatten(item);
            const dims = [item.width, item.height, item.depth];
            const maxDim = Math.max(...dims);
            const minDim = Math.min(...dims);
            const ratio = (maxDim / minDim).toFixed(2);

            const wasRotated = rotated.rotated || false;
            const className = item.is_breakable ? 'breakable' : wasRotated ? 'rotated' : '';

            html += `
                <div class="item ${className}">
                    <strong>${item.description}</strong> (${item.weight}kg)
                    <table>
                        <tr>
                            <td><strong>Breakable:</strong></td>
                            <td>${item.is_breakable ? '🔴 YES' : '🟢 NO'}</td>
                        </tr>
                        <tr>
                            <td><strong>Aspect Ratio:</strong></td>
                            <td>${ratio} (max/${minDim}m = ${maxDim}m)</td>
                        </tr>
                        <tr>
                            <td><strong>Original:</strong></td>
                            <td>${item.width}w × ${item.height}h × ${item.depth}d</td>
                        </tr>
                        <tr>
                            <td><strong>After Rotation:</strong></td>
                            <td>${wasRotated ? `${rotated.width}w × ${rotated.height}h × ${rotated.depth}d ✅ ROTATED` : 'No rotation'}</td>
                        </tr>
                    </table>
                </div>
            `;
        });

        document.body.innerHTML += html;
    </script>
</body>
</html>
